databases:
  - name: leaderboard-postgres
    plan: free
    databaseName: leaderboard
    user: leaderboard_user

services:
  - type: redis
    name: leaderboard-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: leaderboard-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leaderboard-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: leaderboard-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
